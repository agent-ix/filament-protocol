[package]
name = "filament-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
description = "Strict consumer boundary for accepted native Filament protocol packages"
publish = false

[dependencies]
# Cargo.lock holds FSL at the commit that merged #2785 on purpose: FSL main moved
# `checked_handoff` to `fsl-command`. Expires when the fixtures are repointed there
# (ADR-010, "Temporary mirrors and held pins").
# FSL main, followed by branch; Cargo.lock holds the commit. `checked-handoff`
# is the feature that publishes `Selection` (FSL FR-517), which the admission
# compares an admitted package with.
filament-spec-language = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main", features = ["checked-handoff"] }
fsl-foundation = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main" }
# The bytes-only identity and equality files (FSL FR-531, FR-533).
fsl-package = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main" }
# The checked-package evaluation entries (FSL FR-390, FR-520, FR-531, FR-533).
fsl-eval = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main" }
# The channel overflow, loss selector and outstanding vocabulary (FSL FR-308,
# FR-218) the declarations retain, and the wire graph that keys protocol nodes in tests.
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main" }
# The capability-backend registry and candidate sets (FSL FR-075, FR-290), the
# truth and settlement-basis vocabulary and the separating-witness record.
fsl-route = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main" }
# The protocol analysis engine and its `analyze` item adapters (FSL ADR-036).
fsl-analyze = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main" }
fsl-replay = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main" }
filament-eval = { git = "https://github.com/agent-ix/filament-eval", branch = "main" }
filament-exact = { git = "https://github.com/agent-ix/filament-exact", branch = "main" }
filament-semantic-value = { git = "https://github.com/agent-ix/filament-semantic-value", branch = "main" }
# Contract IR's checked-package reader (FR-043); the one reader of the format.
filament-contract-model = { git = "https://github.com/agent-ix/filament-contract-ir", branch = "main" }
filament-observation = { git = "https://github.com/agent-ix/filament-observation", branch = "main" }
filament-verification-contracts = { git = "https://github.com/agent-ix/filament-verification-contracts", branch = "main" }
# Owner of the claim-strength vocabulary (EA FR-022). Only the serde-only
# `claim-strength` feature: no serde_json, no arbitrary_precision.
engineering-assurance = { version = "=0.7.1", git = "https://github.com/agent-ix/engineering-assurance", branch = "main", default-features = false, features = ["claim-strength"] }
serde = { version = "=1.0.228", features = ["derive"] }
jsonschema = { version = "=0.17.1", default-features = false, features = ["draft202012"] }
sha2 = "=0.10.9"

[dev-dependencies]
# The owner's static-bundle test fixture (tc_003_compensation).
filament-observation = { git = "https://github.com/agent-ix/filament-observation", branch = "main", features = ["test-support"] }
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
# FSL's public front end, which a realizability subject is built from in tests
# (a `CheckedPackage` is FSL's in-process form; the handoff does not carry it).
fsl-cst = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main" }
fsl-forms = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main" }
filament-checked = { git = "https://github.com/agent-ix/filament-eval", branch = "main" }
# The counterexample wire spells a state key as unpadded URL-safe base64 (FSpec
# FR-433); the replay tests spell the keys FSL's own system computes.
base64 = "0.22"
serde_json = "=1.0.151"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
